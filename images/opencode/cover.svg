<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#f5a623"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="400" fill="url(#bg)" rx="20"/>

  <!-- 装饰网格 -->
  <g opacity="0.04" stroke="white" stroke-width="0.5">
    <line x1="0" y1="80" x2="800" y2="80"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
  </g>

  <!-- 大标题 -->
  <text x="60" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="white" letter-spacing="2">
    10 分钟上手 OpenCode
  </text>

  <!-- 副标题 -->
  <text x="60" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.6)" letter-spacing="1">
    今天就开始 5x 提效
  </text>

  <!-- 分隔线 -->
  <rect x="60" y="180" width="120" height="3" fill="url(#accent)" rx="2"/>

  <!-- 标签列表 -->
  <g font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.5)">
    <text x="60" y="220">▸ 批量图片压缩转 WebP</text>
    <text x="60" y="248">▸ Hexo Front-matter 批量编辑器</text>
    <text x="60" y="276">▸ 截图 → Markdown 一键引用</text>
    <text x="60" y="304">▸ 全功能番茄钟网页</text>
  </g>

  <!-- 右侧键盘/终端抽象图 -->
  <g transform="translate(560, 80)" opacity="0.15">
    <rect x="0" y="0" width="180" height="260" rx="12" fill="none" stroke="white" stroke-width="1.5"/>
    <rect x="15" y="20" width="150" height="90" rx="6" fill="white" opacity="0.05"/>
    <text x="30" y="50" font-family="monospace" font-size="11" fill="white">> opencode</text>
    <text x="30" y="70" font-family="monospace" font-size="11" fill="white" opacity="0.6">创建一个番茄钟</text>
    <text x="30" y="90" font-family="monospace" font-size="11" fill="#f5a623">> 正在生成...</text>

    <rect x="15" y="130" width="150" height="1" fill="white" opacity="0.1"/>

    <text x="30" y="155" font-family="monospace" font-size="10" fill="white" opacity="0.3">Tab: Build</text>
    <text x="30" y="173" font-family="monospace" font-size="10" fill="white" opacity="0.3">@explore</text>
    <text x="30" y="191" font-family="monospace" font-size="10" fill="white" opacity="0.3">/share</text>

    <rect x="15" y="215" width="60" height="20" rx="10" fill="#e94560" opacity="0.8"/>
    <text x="28" y="229" font-family="system-ui" font-size="10" fill="white" font-weight="600">Plan</text>
    <rect x="85" y="215" width="60" height="20" rx="10" fill="#f5a623" opacity="0.8"/>
    <text x="100" y="229" font-family="system-ui" font-size="10" fill="white" font-weight="600">Build</text>
  </g>

  <!-- 底部渐变条 -->
  <rect x="0" y="380" width="800" height="20" fill="url(#arrow)" rx="0"/>

  <!-- 底部标签 -->
  <text x="60" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="rgba(255,255,255,0.3)">
    生产力乘数 · OpenCode 实战指南
  </text>
</svg>
